services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./staticfiles/:/staticfiles/
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django_app

  django_app:
    build:
      context: ./apps/django_site
      dockerfile: Dockerfile
    command: >
      sh -c "
        python /apps/django_site/manage.py collectstatic --noinput &&
        python /apps/django_site/manage.py migrate &&
        python /apps/django_site/manage.py loaddata /apps/django_site/site_data.json &&
        gunicorn --chdir /apps/django_site --bind 0.0.0.0:8000 django_site.wsgi:application
      "
    ports:
      - "8000:8000"
    logging:
      driver: loki
      options:
        loki-url: http://localhost:3100/loki/api/v1/push
    volumes:
      - ./staticfiles/:/apps/django_site/staticfiles/
    env_file:
      - ./.env
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - ${POSTGRES_PORT}
    volumes:
      - ./db/:/var/lib/postgresql/data
    env_file:
      - ./.env

  grafana:
    image: grafana/grafana:9.2.15
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"

  loki:
    image: grafana/loki:2.8.0
    ports:
      - "3100:3100"
