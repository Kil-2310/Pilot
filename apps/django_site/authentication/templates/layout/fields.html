{% if form.non_field_errors %}<div class="alert danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
{% if field.is_hidden %}{{ field }}{% else %}
<div class="field field-{{ field.name }}{% if field.errors %} has-error{% endif %}">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <em>*</em>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="hint" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="form-error" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endif %}
{% endfor %}
